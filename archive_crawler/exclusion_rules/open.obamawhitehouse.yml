# URL exclusion rules for open.obamawhitehouse. No URL-pattern exclusions
# configured today; low-quality pages are handled via content-based checks
# (no_body/no_title) instead.

extensions:
  mode: allow
  values: [html, htm, php, asp, aspx, shtml, cfm, cgi]

rules: []

# /search/field_tags/X/field_tags/Y/... chains combinatorially - each result
# page links to every other facet combination. Plain /search?page=N
# pagination (below) still reaches the full unfiltered dataset listing.
nav_deny:
  - '/field_tags/'
  # /node/N/download is a resource-download endpoint, not a content page;
  # some redirect off-domain, and REDIRECT_ENABLED=True follows redirects
  # regardless of allowed_domains - block the endpoint itself instead of
  # trying to filter its target.
  - '/node/\d+/download'

# Read by open_obama_whitehouse_harvest (generic_crawl_harvest subclass)
# only - the content spider never reads these two keys. Drupal Views pager
# links on this site use the standard ?page=N convention.
pagination:
  - '\?page='

query_params_allow:
  - page
