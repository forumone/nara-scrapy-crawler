# URL exclusion rules for open.obamawhitehouse. Low-quality pages are also
# handled via content-based checks (no_body/no_title).

extensions:
  mode: allow
  values: [html, htm, php, asp, aspx, shtml, cfm, cgi]

rules:
  # Facet combinations chain combinatorially - every result page links to
  # every other facet combination.
  - match: regex
    pattern: '/field_[a-z_]+/'
    reason: "url_pattern:/field_[a-z_]+/"
  # Query-string form of the same facet mechanism (Drupal Facet API).
  - match: regex
    pattern: 'f%5B\d+%5D='
    reason: "url_pattern:f%5B\\d+%5D="
  # Resource-download endpoint, not a content page.
  - match: contains
    pattern: "/download"
    reason: "url_pattern:/download"
  # DKAN's JSON API, linked from every dataset page - not a content page.
  - match: contains
    pattern: "/api/"
    reason: "url_pattern:/api/"
  # Drupal version-history pages, linked from every node - always empty.
  - match: contains
    pattern: "/revisions"
    reason: "url_pattern:/revisions"
