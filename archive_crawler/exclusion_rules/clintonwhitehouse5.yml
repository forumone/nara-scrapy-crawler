# URL-pattern exclusion rules for clintonwhitehouse5. Evaluated in order at
# start_requests time; first match wins. Case-sensitive substring matches,
# same as the Python `in` operator this replaces - /omb/ and /OMB/ are
# deliberately distinct rules.
#
# /textonly/ is a text-only mirror (11k of 26k URLs).
# OMB dirs: OMB-upper (1984 URLs) = omb (1815) + OMB (169); OMB-bak ~ OMB-upper.
# Keep /OMB-upper/ as the most complete unique set; skip the rest.

extensions:
  mode: allow
  values: [html, htm, php, asp, aspx, shtml, cfm, cgi]

rules:
  # Text-only mirror of the main site (11k of 26k URLs) - same content,
  # plain-text template. Example:
  # https://clintonwhitehouse5.archives.gov/textonly/WH/New/SouthAsia/photo_gallery/day_3/photo16.html
  - match: contains
    pattern: "/textonly/"
    reason: "url_pattern:/textonly/"
  # Lowercase alias directory duplicating /OMB/'s content (omb: 1815 URLs,
  # OMB: 169 - both fold into the same canonical set /OMB-upper/ below
  # already captures). Example:
  # https://clintonwhitehouse5.archives.gov/omb/legislative/sap/1999/HR436-h.html
  - match: contains
    pattern: "/omb/"
    reason: "url_pattern:/omb/"
  # Canonical-cased OMB directory, itself an alias of /OMB-upper/ (see
  # below) on this site - kept as its own rule since /omb/ and /OMB/ are
  # deliberately distinct, case-sensitive matches. Example:
  # https://clintonwhitehouse5.archives.gov/WH/EOP/OMB/MAX/1intro.html
  - match: contains
    pattern: "/OMB/"
    reason: "url_pattern:/OMB/"
  # Backup/mirror alias directory (~ /OMB-upper/'s content). /OMB-upper/
  # itself is kept as the single canonical, most-complete unique OMB set on
  # this site - not excluded, no rule needed for it. Example:
  # https://clintonwhitehouse5.archives.gov/OMB-bak/legislative/sap/1999/HR2513-h.html
  - match: contains
    pattern: "/OMB-bak/"
    reason: "url_pattern:/OMB-bak/"
