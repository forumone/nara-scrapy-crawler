# URL exclusion rules for letsmove.obamawhitehouse. Low-quality pages are
# also handled via content-based checks (no_body/no_title).

extensions:
  mode: allow
  values: [html, htm, php, asp, aspx, shtml, cfm, cgi]

rules:
  - match: contains
    pattern: "/sites/"
    reason: "url_pattern:/sites/"
  - match: contains
    pattern: "/user/"
    reason: "url_pattern:/user/"
  - match: contains
    pattern: "/print/"
    reason: "url_pattern:/print/"
  - match: contains
    pattern: "/category/"
    reason: "url_pattern:/category/"
