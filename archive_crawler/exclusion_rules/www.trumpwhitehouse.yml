# URL exclusion rules for trumpwhitehouse.archives.gov (SOURCE_SITE = www.trumpwhitehouse).
# No URL-pattern exclusions configured today. The site's per-issue facet
# filters (e.g. /briefings-statements/?issue_filter=healthcare) are each a
# genuinely distinct item subset, not a duplicate of the unfiltered listing,
# so NavHarvesterMixin's listing-fingerprint dedup handles them without a
# nav_deny/rules entry: each filtered listing is walked once (its own
# fingerprint), and the individual articles it links to are only ever
# scraped once regardless of how many filters surface them.

extensions:
  mode: allow
  values: [html, htm, php, asp, aspx, shtml, cfm, cgi]

# Every article's "copy URL to clipboard" share button links back to itself
# with a utm_* tracking param appended (?utm_source=link, or
# ?utm_source=ods&utm_medium=email&utm_campaign=... on email-distributed
# links). Previously handled here as a `rules:` exclusion
# (duplicate_utm_tracking_param), which rejected the decorated URL outright
# and relied on its bare form being independently reachable some other way -
# it wasn't, for 6 pages only ever linked from an email-campaign URL, so
# those pages were silently missing from the scrape entirely. Now handled
# generically by NavHarvesterMixin stripping any utm_*-prefixed query param
# before a link is followed (exclusion_rules.strip_denied_query_params), so
# the tracking-decorated URL collapses onto the same request as its bare
# canonical form instead of being excluded - no rules: entry needed.

nav_deny: []
