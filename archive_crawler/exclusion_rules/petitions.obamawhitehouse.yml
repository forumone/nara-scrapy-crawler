# URL exclusion rules for petitions.obamawhitehouse. No URL-pattern
# exclusions configured today; low-quality pages are handled via
# content-based checks (no_body/no_title) instead.

extensions:
  mode: allow
  values: [html, htm, php, asp, aspx, shtml, cfm, cgi]

rules: []

nav_deny: []

# Read by obama_petitions_harvest (generic_crawl_harvest subclass) only -
# the content spider never reads these two keys. Drupal Views pager links
# on this site use the standard ?page=N convention.
pagination:
  - '\?page='

query_params_allow:
  - page
